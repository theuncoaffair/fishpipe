plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def licenseApiBaseUrl = localProperties.getProperty('FISHPIPE_API_BASE_URL', '')
def releaseStoreFileValue = localProperties.getProperty('RELEASE_STORE_FILE',
        System.getenv('FISHPIPE_RELEASE_STORE_FILE') ?: '')
def releaseStorePasswordValue = localProperties.getProperty('RELEASE_STORE_PASSWORD',
        System.getenv('FISHPIPE_RELEASE_STORE_PASSWORD') ?: '')
def releaseKeyAliasValue = localProperties.getProperty('RELEASE_KEY_ALIAS',
        System.getenv('FISHPIPE_RELEASE_KEY_ALIAS') ?: '')
def releaseKeyPasswordValue = localProperties.getProperty('RELEASE_KEY_PASSWORD',
        System.getenv('FISHPIPE_RELEASE_KEY_PASSWORD') ?: '')
def releaseSigningReady = [releaseStoreFileValue, releaseStorePasswordValue,
                           releaseKeyAliasValue, releaseKeyPasswordValue].every {
    it != null && !it.trim().isEmpty()
}
def escapeBuildConfig = { value -> value.replace('\\', '\\\\').replace('"', '\\"') }

android {
    namespace 'com.theuncoaffair.fishpipe'
    compileSdk 34
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'com.theuncoaffair.fishpipe'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '0.0.8'
        buildConfigField 'String', 'LICENSE_API_BASE_URL', "\"${escapeBuildConfig(licenseApiBaseUrl)}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseStoreFileValue)
                storePassword releaseStorePasswordValue
                keyAlias releaseKeyAliasValue
                keyPassword releaseKeyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'com.google.dagger:hilt-android:2.51.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.51.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
